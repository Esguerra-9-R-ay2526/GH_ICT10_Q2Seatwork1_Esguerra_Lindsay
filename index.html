<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Southeast Asia Nicknames</title>

    <!--Pyscript-->
    <link rel="stylesheet" href="https://pyscript.net/releases/2026.7.3/core.css">
    <script type="module" src="https://pyscript.net/releases/2026.7.3/core.js"></script>

    <!--Bootstrap-->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">

    <!--Fonts-->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Source+Sans+3:wght@400;600&display=swap" rel="stylesheet">

    <style>
        :root {
            --brown-deep: #4A2C1A;   /* hero, headings */
            --brown:      #7B4A2B;   /* primary action */
            --brown-dk:   #5E3720;   /* button hover */
            --gold:       #E9CF84;   /* light gold accent */
            --bisque:     #FFE4C4;   /* page background */
            --rust:       #8B4513;   /* result highlight */
            --ink:        #2B1A10;   /* body text */
        }

        body {
            font-family: "Source Sans 3", system-ui, sans-serif;
            color: var(--ink);
            background: var(--bisque);
            min-height: 100vh;
        }

        /* Hero */
        .hero {
            background: var(--brown-deep);
            color: var(--bisque);
            padding: 4rem 1rem 6rem;
            text-align: center;
            position: relative;
        }
        .hero h1 {
            font-family: "Bricolage Grotesque", sans-serif;
            font-weight: 800;
            font-size: clamp(2.5rem, 7vw, 4.25rem);
            letter-spacing: -0.02em;
            margin: 0 0 .5rem;
        }
        .hero h2 {
            font-family: "Bricolage Grotesque", sans-serif;
            font-weight: 600;
            font-size: clamp(1.1rem, 3vw, 1.5rem);
            color: var(--gold);
            margin: 0 0 1rem;
        }
        .hero p {
            max-width: 46ch;
            margin: 0 auto;
            color: #ecd3b4;
            font-size: 1.1rem;
        }
        .hero svg {
            position: absolute;
            left: 0; bottom: -1px;
            width: 100%; height: 56px;
            display: block;
        }

        /* Finder card */
        .finder {
            max-width: 520px;
            margin: -2.5rem auto 3rem;
            background: #fffaf3;
            border-radius: 16px;
            padding: 2rem;
            box-shadow: 0 12px 32px rgba(74, 44, 26, .2);
            position: relative;
        }
        .finder label {
            font-weight: 600;
            margin-bottom: .4rem;
            display: block;
        }
        .finder input[type="text"] {
            width: 100%;
            padding: .8rem 1rem;
            font-size: 1.05rem;
            border: 2px solid #e6c9a3;
            border-radius: 10px;
            background: #fff;
            color: var(--ink);
        }
        .finder input[type="text"]:focus {
            outline: 3px solid rgba(233, 207, 132, .7);
            border-color: var(--brown);
        }
        .finder button {
            width: 100%;
            margin-top: 1rem;
            padding: .85rem 1rem;
            font-size: 1.05rem;
            font-weight: 600;
            color: #fff;
            background: var(--brown);
            border: 0;
            border-radius: 10px;
            cursor: pointer;
            transition: background .15s ease;
        }
        .finder button:hover { background: var(--brown-dk); }
        .finder button:focus-visible {
            outline: 3px solid var(--gold);
            outline-offset: 2px;
        }

        /* Result */
        #result {
            margin-top: 1.5rem;
            padding: 1rem 1.25rem;
            background: var(--bisque);
            border-left: 5px solid var(--gold);
            border-radius: 8px;
            font-size: 1.15rem;
            min-height: 3.5rem;
        }
        #result strong { color: var(--rust); }

        @media (prefers-reduced-motion: reduce) {
            * { transition: none !important; }
        }
    </style>
</head>

<body>
    <header class="hero">
        <p>ICT - SW1</p>
        <h1>Southeast Asia</h1>
        <h2>Country Nickname Finder</h2>
        <p>Enter a Southeast Asian country to see its nickname.</p>
        <svg viewBox="0 0 1440 56" preserveAspectRatio="none" aria-hidden="true">
            <path fill="#FFE4C4" d="M0,32 C240,64 480,0 720,28 C960,56 1200,8 1440,32 L1440,56 L0,56 Z"/>
        </svg>
    </header>

    <main class="container">
        <section class="finder">
            <label for="country">Country</label>
            <input type="text" id="country" placeholder="Enter a country"><br><br>
            <button py-click="country_nickname">Find Nickname</button>
            <div id="result" aria-live="polite">Result will appear here.</div>
        </section>
    </main>

    <py-script src="main.py"></py-script>
</body>
</html>
